name: Security & Quality

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  x402_typescript:
    name: x402 TypeScript Offline Conformance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/x402-stellar-facilitator
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
          cache-dependency-path: services/x402-stellar-facilitator/pnpm-lock.yaml
      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Supply-chain and license gate
        run: pnpm run check:supply-chain
      - name: Strict typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
      - name: Node built-in tests
        run: pnpm test
      - name: Default-off testnet plan
        run: pnpm run testnet:plan

  fmt_clippy:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test all targets and features
        run: cargo test --all-targets --all-features

  zk_soroban:
    name: ZK Soroban Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add clippy rustfmt
      - name: Format nested Soroban workspace
        run: cargo fmt --manifest-path hackathons/stellar-real-world-zk/soroban/Cargo.toml --check
      - name: Clippy nested Soroban workspace
        run: cargo clippy --manifest-path hackathons/stellar-real-world-zk/soroban/Cargo.toml --all-targets -- -D warnings
      - name: Test contract and genuine Groth16 fixtures
        run: cargo test --manifest-path hackathons/stellar-real-world-zk/soroban/Cargo.toml

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run audit
        run: |
          # Known transitive warnings are scoped and documented in docs/security.md.
          cargo audit --deny warnings \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2026-0186
